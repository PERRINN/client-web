<div class="appShell sidebarShell">
  <img class="fullScreenImage" id="fullScreenImage" (click)="hideFullScreenImage()">
  <progress value='0' max='100' id='uploader' class="uploadProgress">0%</progress>

    <header class="mobileShellHeader">
      <button #menuToggle type="button" (click)="openSidebar()" aria-label="Open navigation" aria-controls="shell-navigation" [attr.aria-expanded]="sidebarOpen"><span class="hamburgerIcon" aria-hidden="true"><span></span><span></span><span></span></span></button>
      <a routerLink="/profile/all">PERRINN</a>
    </header>
    @if (sidebarOpen) {
      <button class="shellBackdrop" type="button" aria-label="Close navigation" (click)="closeSidebar()"></button>
    }
  <div class="topNav shellSidebar" id="shell-navigation" tabindex="-1" [class.sidebarOpen]="sidebarOpen" [attr.inert]="mobileLayout && !sidebarOpen ? '' : null" (keydown)="onSidebarKeydown($event)">
    <nav #sidebarNavigation class="navLeft" aria-label="Main navigation">
      <button class="iconBtn" (click)="router.navigate(['profile','all'])" aria-label="Go to profile">
        <img src="./../assets/App icons/perrinn-02.png" class="brandIcon" alt="">
        <span>PERRINN</span>
      </button>
      <button class="iconBtn" (click)="router.navigate(['directory'])" aria-label="Open directory">
        <span class="material-icons">list</span>
        <span>Directory</span>
      </button>
      <button class="iconBtn" (click)="openDiscover()" aria-label="Open discover">
        <span class="material-icons-outlined">info</span>
        <span>Discover</span>
      </button>
      <button class="iconBtn" routerLink="/apps" routerLinkActive="activeNav" [attr.aria-current]="router.url === '/apps' ? 'page' : null" aria-label="Open apps">
        <span class="material-icons-outlined">apps</span>
        <span>Apps</span>
      </button>
    </nav>
      <section class="sideProfile" aria-label="Conversations">
        <profile [sidePanelScope]="'all'"></profile>
      </section>
    <div class="navRight">
      @if (!UI.currentUser) {
        <button class="buttonSecondary" (click)="router.navigate(['login'])" [disabled]='this.router.url.startsWith("/login")'>
          Login
        </button>
      }

      @if (UI.currentUser) {
        <button type="button" class="accountRow" (click)="router.navigate(['profile',UI.currentUser])" aria-label="Open your profile and wallet">
          @if (UI.currentUserLastMessageObj?.imageUrlThumbUser) {
            <img [src]="UI.currentUserLastMessageObj?.imageUrlThumbUser" (error)="UI.handleUserImageError($event, UI.currentUserLastMessageObj)" class="accountAvatar" alt="">
          } @else {
            <span class="material-icons-outlined accountAvatar accountFallback" aria-hidden="true">person</span>
          }
          <span class="accountInfo">
            <span class="accountName">{{UI.currentUserLastMessageObj?.name || 'Your profile'}}</span>
            <span class="accountBalance">{{UI.convertAndFormatPRNToPRNCurrency(null,UI.currentUserLastMessageObj?.wallet?.balance||0)}}</span>
          </span>
          @if (UI.isCurrentUserMember) {
            <span class="material-icons accountMember" role="img" aria-label="Member">check_circle</span>
          }
        </button>
      }

    </div>
  </div>

  <div id='main_container' [attr.inert]="mobileLayout && sidebarOpen ? '' : null">
    <div id='secondary_container' class="contentWrap">
      <div class="contentCard">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

</div>
