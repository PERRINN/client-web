<figure>
  <figcaption>
  <h3>{{ title }}</h3>
  <span>{{ unit }} · synthetic</span>
  </figcaption>
  <svg viewBox="0 0 570 202" role="img" [attr.aria-label]="title + ': ' + series.length + ' synthetic traces; exact values below'">
    @for (fraction of [0, .5, 1]; track fraction) {
      <line x1="52" x2="540" [attr.y1]="28 + fraction * 130" [attr.y2]="28 + fraction * 130" class="grid" />
      <text x="46" [attr.y]="32 + fraction * 130" text-anchor="end">{{ format(maximum - fraction * span) }}</text>
    }
    @if (minimum < 0 && maximum > 0) { <line x1="52" x2="540" [attr.y1]="y(0)" [attr.y2]="y(0)" class="zero" /> }
    @for (trace of series; track trace.name; let index = $index) {
      <polyline [attr.points]="points(trace)" [class.reference]="index === 0 && series.length > 1" class="trace" />
      <circle [attr.cx]="x(cursor)" [attr.cy]="y(trace.values[cursor])" r="4" [class.reference-dot]="index === 0 && series.length > 1" />
    }
    <line [attr.x1]="x(cursor)" [attr.x2]="x(cursor)" y1="28" y2="158" class="cursor" />
    <text x="52" y="180">{{ xValues[0] | number:'1.0-0' }}</text>
  <text x="540" y="180" text-anchor="end">{{ xValues[xValues.length - 1] | number:'1.0-0' }}</text>
    <text x="296" y="198" text-anchor="middle">{{ xLabel }}</text>
  </svg>
  <div class="readout">
    @for (trace of series; track trace.name; let index = $index) {
      <p>
  <span class="key" [class.dashed]="index === 0 && series.length > 1" aria-hidden="true">
  </span>{{ trace.name }}: {{ format(trace.values[cursor]) }} {{ unit }}</p>
    }
  </div>
</figure>
