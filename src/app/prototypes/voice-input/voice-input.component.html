<main class="voice-page">
  <a class="back" routerLink="/prototypes">← Prototyping</a>
  <section class="capture-panel" aria-label="Voice recording">
    <button class="talk" type="button" [class.recording]="voice.phase === 'recording'"
      [disabled]="!voice.ready || !voice.uid || voice.phase === 'sending' || !!voice.pending"
      [attr.aria-pressed]="voice.phase === 'recording'" [attr.aria-label]="voice.label + ' · 30 seconds maximum'"
      [attr.aria-busy]="voice.phase === 'requesting' || voice.phase === 'sending'" aria-describedby="voice-status"
      (pointerdown)="pointerDown($event)" (pointerup)="pointerUp($event)"
      (pointercancel)="pointerCancel($event)" (lostpointercapture)="pointerCancel($event)"
      (keydown)="keyDown($event)" (keyup)="keyUp($event)" (blur)="interrupt()"
      (contextmenu)="$event.preventDefault()" (click)="$event.preventDefault()">
      <span class="talk-logo" aria-hidden="true"></span>
    </button>
    <p id="voice-status" class="sr-only" role="status">{{ !voice.ready ? 'Loading' : voice.busy ? voice.label : '' }}</p>
    @if (voice.ready && !voice.uid) { <a class="sign-in" routerLink="/login" [queryParams]="{returnUrl: '/prototypes/voice-input'}">Sign in to record</a> }
    @if (voice.error) { <p class="error" role="alert">{{ voice.error }}</p> }
    @if (voice.pending && voice.phase !== 'sending') {
      <div class="recovery">
        <button type="button" (click)="voice.check()">Check recording</button>
        <button type="button" (click)="voice.recordAgain()">Record again</button>
      </div>
    }
  </section>
  @if (voice.transcript) {
    <section class="transcript" aria-label="Saved transcript">
      <p>{{ voice.transcript }}</p>
    </section>
  }
</main>
